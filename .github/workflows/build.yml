name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_SHA512_LINUX: "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65"
  GODOT_SHA512_TEMPLATES: "ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079"
  GODOT_SHA512_MACOS: "38aa16e5bba2083941fc5b3e54be0089bd4cc35e32415f5b9fd9a8a6a7b9818255d44532ea8ef94b5aef56c4b407c2d634fa4f657e4ebe681ebbf59b7bac69ca"

permissions:
  contents: write

jobs:
  test-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-v1

      - name: Download Godot + export templates (verified)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-cache && cd ~/godot-cache
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "${GODOT_SHA512_LINUX}  godot.zip" | sha512sum -c -
          echo "${GODOT_SHA512_TEMPLATES}  templates.tpz" | sha512sum -c -

      - name: Install Godot
        run: |
          cd ~/godot-cache
          unzip -o -q godot.zip
          sudo ln -sf ~/godot-cache/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -o -q templates.tpz -d /tmp/tpl
          cp -r /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          godot --version

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Run tests
        run: godot --headless --path . --script res://tests/run_tests.gd

      - name: Balance report
        run: godot --headless --path . --script res://tools/sim_stats.gd > balance_report.txt

      - name: Export desktop builds
        run: |
          mkdir -p build/windows build/linux build/windows-dev
          godot --headless --path . --export-release "Windows" build/windows/PocketBoundary.exe
          godot --headless --path . --export-debug "Windows Dev" build/windows-dev/PocketBoundary-dev.exe
          godot --headless --path . --export-release "Linux" build/linux/PocketBoundary.x86_64
          test -s build/windows/PocketBoundary.exe
          # Release builds must not contain the development harness.
          ! grep -q "scripts/dev/dev_harness" build/windows/PocketBoundary.exe
          ! grep -q "scripts/dev/dev_harness" build/linux/PocketBoundary.x86_64

      - name: Configure Android export (fixed debug-only key so updates install over old builds)
        run: |
          mkdir -p ~/.config/godot
          KS="$GITHUB_WORKSPACE/android/debug-only.keystore"
          printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME_17_X64\"" \
            "export/android/debug_keystore = \"$KS\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' > ~/.config/godot/editor_settings-4.7.tres
          cat ~/.config/godot/editor_settings-4.7.tres

      - name: Version code = build number (every store upload must be higher)
        run: |
          sed -i "s/^version\/code=1$/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          grep -n "^version/code" export_presets.cfg

      - name: Export Android debug APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/PocketBoundary-debug.apk
          test -s build/android/PocketBoundary-debug.apk
          rm -f build/android/*.idsig

      - name: Verify Android APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs build/android/PocketBoundary-debug.apk
          "$BT/aapt2" dump badging build/android/PocketBoundary-debug.apk | grep -iE "^package|sdkVersion|native-code|launchable-activity"
          "$BT/zipalign" -c -P 16 -v 4 build/android/PocketBoundary-debug.apk | tail -1
          ls -l build/android/PocketBoundary-debug.apk
          sha256sum build/android/PocketBoundary-debug.apk
          unzip -l build/android/PocketBoundary-debug.apk | grep -E "lib/.*\.so" 

      - name: Publish test APK as a direct download (GitHub Release, no zip)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-build-${GITHUB_RUN_NUMBER}"
          APK="PocketBoundary-test-${GITHUB_RUN_NUMBER}.apk"
          cp build/android/PocketBoundary-debug.apk "$APK"
          SIZE=$(stat -c %s "$APK")
          SUM=$(sha256sum "$APK" | cut -d' ' -f1)
          WIN="PocketBoundary-windows-test-${GITHUB_RUN_NUMBER}.zip"
          cat > notes.md <<EOT
          Test build ${GITHUB_RUN_NUMBER} (commit ${GITHUB_SHA::7}) for Android phones and Windows PCs.

          Android: download **$APK** below and tap it to install (no unzipping needed).
          Windows: download **$WIN**, unzip, double-click PocketBoundary.exe.
          APK size: $SIZE bytes. APK SHA-256: \`$SUM\`

          Debug-signed test build - not for the Play Store.
          EOT
          WIN="PocketBoundary-windows-test-${GITHUB_RUN_NUMBER}.zip"
          (cd build/windows && zip -q -9 "$GITHUB_WORKSPACE/$WIN" PocketBoundary.exe)
          gh release create "$TAG" "$APK" "$WIN" --target "$GITHUB_SHA" --prerelease \
            --title "Pocket Boundary test build ${GITHUB_RUN_NUMBER}" --notes-file notes.md

      - name: Build Google Play App Bundle (.aab)
        timeout-minutes: 25
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_KS_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KS_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          UPLOAD_KS_PASS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build/store
          if [ -n "$UPLOAD_KS_B64" ]; then
            # Signed with the owner's upload key (kept only in GitHub Secrets, never in the repo).
            echo "$UPLOAD_KS_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/upload.keystore"
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$UPLOAD_KS_ALIAS"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$UPLOAD_KS_PASS"
            timeout 1200 godot --headless --verbose --path . --install-android-build-template --export-release "Android Store" build/store/PocketBoundary-play-${GITHUB_RUN_NUMBER}.aab
            rm -f "$RUNNER_TEMP/upload.keystore"
            echo "STORE_AAB=build/store/PocketBoundary-play-${GITHUB_RUN_NUMBER}.aab" >> "$GITHUB_ENV"
          else
            # No upload key configured yet: build a debug-signed bundle only to prove the
            # store build works. It is NOT uploadable to Google Play.
            timeout 1200 godot --headless --verbose --path . --install-android-build-template --export-debug "Android Store" build/store/PocketBoundary-pipeline-check.aab
          fi
          AAB=$(ls build/store/*.aab | head -1)
          test -s "$AAB"
          unzip -l "$AAB" | grep -E "base/manifest/AndroidManifest.xml|base/lib/arm64-v8a/.*\.so"
          "$JAVA_HOME_17_X64/bin/jarsigner" -verify "$AAB" | tail -1
          ls -l "$AAB"
          if [ -n "${STORE_AAB:-}" ] && [ "${{ github.event_name }}" = "push" ]; then
            gh release upload "test-build-${GITHUB_RUN_NUMBER}" "$STORE_AAB" --clobber
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PocketBoundary-google-play-bundle
          path: build/store/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: PocketBoundary-windows
          path: build/windows/
      - uses: actions/upload-artifact@v4
        with:
          name: PocketBoundary-windows-dev
          path: build/windows-dev/
      - uses: actions/upload-artifact@v4
        with:
          name: PocketBoundary-linux
          path: build/linux/
      - uses: actions/upload-artifact@v4
        with:
          name: PocketBoundary-android-debug
          path: build/android/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: balance-report
          path: balance_report.txt

  ios-check:
    # Exports the Xcode project and compiles it (unsigned) on a Mac, proving the iOS build
    # works. Signing and App Store upload need the owner's Apple Developer account.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot (macOS) + export templates (verified)
        run: |
          mkdir -p ~/godot-dl && cd ~/godot-dl
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "${GODOT_SHA512_MACOS}  godot.zip" | shasum -a 512 -c -
          echo "${GODOT_SHA512_TEMPLATES}  templates.tpz" | shasum -a 512 -c -
          unzip -q godot.zip
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d tpl
          cp -R tpl/templates/* "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable/"
          echo "GODOT=$HOME/godot-dl/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Import project
        run: |
          "$GODOT" --headless --path . --import || true

      - name: Export Xcode project
        run: |
          # A placeholder team id is enough to generate the project; the owner's real
          # Apple team id goes in at signing time.
          sed -i '' 's/^application\/app_store_team_id=""/application\/app_store_team_id="ABCDE12345"/' export_presets.cfg
          mkdir -p build/ios
          "$GODOT" --headless --path . --export-release "iOS" build/ios/PocketBoundary.ipa
          ls build/ios

      - name: Compile for iPhone (unsigned)
        run: |
          cd build/ios
          xcodebuild -version
          xcodebuild -project PocketBoundary.xcodeproj -scheme PocketBoundary -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -20
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" PocketBoundary/PocketBoundary-Info.plist || true
          ls PocketBoundary/*.xcprivacy 2>/dev/null || find . -name "*.xcprivacy" | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: PocketBoundary-ios-xcode-project
          path: build/ios/
          if-no-files-found: warn
